services:
  - type: web
    name: stillwork-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r agent_service/requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_INPUT_PRICE_PER_M
        value: "0.0"
      - key: GEMINI_OUTPUT_PRICE_PER_M
        value: "0.0"
      - key: RUN_INLINE_WORKER
        value: "true"
      - key: MAX_JOBS_PER_USER
        value: "3"
      - key: JOB_TIMEOUT_SECS
        value: "300"
      - key: DEBUG
        value: "false"
